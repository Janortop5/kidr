---
- name: Install Helm using official script
  ansible.builtin.shell:
    cmd: |
      curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
    creates: /usr/local/bin/helm
  when: "'master-node' in group_names"
  register: helm_install

- name: Verify Helm installation
  ansible.builtin.command: helm version --short
  register: helm_version
  changed_when: false
  when: "'master-node' in group_names"

- name: Display Helm version
  ansible.builtin.debug:
    var: helm_version.stdout
  when: "'master-node' in group_names"

# Add Prometheus Helm repository
- name: Add Prometheus Helm repository
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: https://prometheus-community.github.io/helm-charts
  register: helm_repo_add

- name: Add Grafana Helm repository
  kubernetes.core.helm_repository:
    name: grafana
    repo_url: https://grafana.github.io/helm-charts
  register: helm_repo_add

# Add Chaos Mesh Helm repository
- name: Add Chaos Mesh Helm repository
  kubernetes.core.helm_repository:
    name: chaos-mesh
    repo_url: https://charts.chaos-mesh.org
  register: helm_repo_add

# Update Helm repositories
- name: Update Helm repositories
  ansible.builtin.command: helm repo update
  changed_when: true
  register: helm_repo_update
  until: helm_repo_update is succeeded

- name: Push Prometheus values to remote
  ansible.builtin.copy:
    src: k8s-observability/values-prometheus.yaml
    dest: /tmp/values-prometheus.yaml
    mode: '0644'
    
- name: Install Prometheus using Helm
  kubernetes.core.helm:
    name: prometheus
    chart_ref: prometheus-community/kube-prometheus-stack
    namespace: monitoring
    create_namespace: true
    state: present
    values_files: /tmp/values-prometheus.yaml

- name: Install standalone Promtail for audit logs
  kubernetes.core.helm:
    name: promtail-audit
    chart_ref: grafana/loki-stack
    namespace: monitoring
    create_namespace: false
    state: present
    kubeconfig: /etc/kubernetes/admin.conf 
    values:
      loki:
        enabled: false
      promtail:
        enabled: true
        extraVolumes:
          - name: audit-logs
            hostPath:
              path: /var/log/kubernetes/audit
              type: DirectoryOrCreate
        extraVolumeMounts:
          - name: audit-logs
            mountPath: /var/log/kubernetes/audit
            readOnly: true
        extraScrapeConfigs: |
          - job_name: kubernetes-audit
            static_configs:
              - targets: ['localhost']
                labels:
                  job: kubernetes-audit
                  __path__: /var/log/kubernetes/audit/audit.log

- name: Install Chaos Mesh
  kubernetes.core.helm:
    name: chaos-mesh
    chart_ref: chaos-mesh/chaos-mesh
    namespace: chaos-testing
    create_namespace: true
    state: present
    kubeconfig: /etc/kubernetes/admin.conf 
    values:
      dashboard:
        create: true
      crds:
        install: true
      dnsServer:
        create: true
